<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Счётчик</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Счётчик</h1>

    <p class="value" id="value">0</p>

    <p class="status" id="status">Число равно нулю</p>

    <div class="buttons">
      <button id="increase" type="button">+1</button>
      <button id="decrease" type="button">−1</button>
      <button id="reset" type="button">Сброс</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
