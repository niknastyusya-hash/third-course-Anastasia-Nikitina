<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Алгоритмы ЦДА и Брезенхема</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>ЦДА и Брезенхем</h1>

    <form class="controls" id="controls">
      <label>
        x1
        <input type="number" id="x1" value="2" min="0">
      </label>
      <label>
        y1
        <input type="number" id="y1" value="2" min="0">
      </label>
      <label>
        x2
        <input type="number" id="x2" value="20" min="0">
      </label>
      <label>
        y2
        <input type="number" id="y2" value="8" min="0">
      </label>

      <label>
        Алгоритм
        <select id="algorithm">
          <option value="dda">ЦДА</option>
          <option value="bresenham" selected>Брезенхем</option>
        </select>
      </label>

      <button type="submit">Построить</button>
    </form>

    <canvas id="canvas" width="640" height="480"></canvas>

    <section class="pixels-section">
      <h2>Выбранные пиксели</h2>
      <ol class="pixels-list" id="pixels-list"></ol>
    </section>

    <section class="steps-section">
      <h2>Таблица Брезенхема</h2>
      <div class="table-wrap">
        <table id="steps-table">
          <thead>
            <tr>
              <th>шаг</th>
              <th>x</th>
              <th>y</th>
              <th>error</th>
              <th>error2</th>
              <th>Δx</th>
              <th>Δy</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="experiment-section">
      <h2>Эксперимент</h2>
      <p class="hint">Строим 1000 случайных отрезков каждым алгоритмом и замеряем время.</p>
      <button type="button" id="experiment-btn">Запустить эксперимент</button>
      <pre class="experiment-output" id="experiment-output"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
